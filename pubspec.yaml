name: blind_typing
description: "Audio-first Hungarian touch-typing prototype."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - data/
    - data/lessons/
    - data/practice/
  fonts:
    - family: DejaVuSansMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf

# WAV and MP3 use built-in decoders; additional codec libraries are unnecessary.
hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true
